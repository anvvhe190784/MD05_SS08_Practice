stages:
  - test
  - build_image
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""

test_job:
  stage: test
  image: gradle:8.5-jdk17-alpine
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: testdb_ci
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: secret
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb_ci
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: secret
  script:
    - gradle test --no-daemon

build_image_job:
  stage: build_image
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy_job:
  stage: deploy
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "Deploying $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA to target environment..."
    - docker images | grep "$CI_REGISTRY_IMAGE"
